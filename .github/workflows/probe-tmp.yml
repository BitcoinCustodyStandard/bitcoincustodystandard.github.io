name: probe-tmp
# Temporary: one-off probe of free on-chain APIs from the Actions network. Removed after use.
on:
  push:
    branches: ['claude/bitcoin-market-intelligence-qz1k50']
    paths: ['.github/workflows/probe-tmp.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in supply-profit percent-supply-profit profit-supply; do
            echo "== $p"; curl -sS -m 40 "https://bitcoin-data.com/v1/$p/last" -w "\nHTTP %{http_code}\n" | head -c 600; echo; sleep 3
          done
          echo "== sopr range"; curl -sS -m 40 "https://bitcoin-data.com/v1/sopr?startday=2026-08-01" | head -c 400; echo
          echo "== coinmetrics"
          curl -sS -m 60 "https://community-api.coinmetrics.io/v4/timeseries/asset-metrics?assets=btc&metrics=CapMVRVCur,PriceUSD&frequency=1d&start_time=2011-01-01&page_size=10000" -o cm.json -w "HTTP %{http_code} %{size_download}\n"
          python3 -c "import json;d=json.load(open('cm.json'));x=d.get('data',[]);print(len(x),x[:1],x[-1:],'next' in json.dumps(d)[-300:], d.get('error'))"
